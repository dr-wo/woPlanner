[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woplanner"
version = "0.1.0"
description = "Interactive Formula 1 race planner GUI and service layer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { email = "zhxutong517@gmail.com" }
]
dependencies = [
  "numpy>=1.23.1,<3.0.0",
  "pandas>=1.4.1,<3.0.0",
  "PySide6",
  "pyqtgraph",
  "wodata",
  "wostrategy",
]

[project.scripts]
woplanner = "woplanner.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/woplanner"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
